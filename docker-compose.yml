services:
  app:
    build: .
    image: event-ticket-booking:1.0.0
    ports:
      - "8080:4000"
    environment:
      PORT: 4000
      DATABASE_URL: file:/data/app.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  app-data:
